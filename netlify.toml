[build]
  publish = "build"
  command = "npm run build"
  base = ""

[build.environment]
  NETLIFY_BUILD_IMAGE = "ubuntu-noble-24.04"
  NODE_VERSION = "22"
  SECRETS_SCAN_OMIT_KEYS = "REACT_APP_SUPABASE_ANON_KEY,REACT_APP_MENU_SUPABASE_ANON_KEY"

[build.processing]
  skip_processing = false

[build.processing.images]
  compress = false

[context.production.environment]
  NODE_ENV = "production"
  REACT_APP_GUMLET_BASE_URL = "https://consciouscafe.gumlet.io"
  REACT_APP_USE_GUMLET = "true"

[context.deploy-preview]
  environment = { NODE_ENV = "production" }

[context.branch-deploy]
  environment = { NODE_ENV = "production" }

# Redirects declared here are evaluated BEFORE public/_redirects, and the first
# match wins — so anything more specific than the SPA catch-all has to live here,
# above it, or the catch-all swallows it and returns the app shell with a 200.

# The old /contact page (a dummy form) folded into /visit.
[[redirects]]
  from = "/contact"
  to = "/visit"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/static/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"

# Image optimization headers
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Specific image formats
[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.JPG"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"